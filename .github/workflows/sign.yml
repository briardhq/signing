# The release signature: the one place the release key is used.
#
# The key is a secret of the `release` environment, whose deployments are restricted to main. Only
# the owner can write to this repository, so main moves only when the owner merges a pull request,
# and the merge is the approval: a push of releases/** or catalog/** starts this job. It signs
# every release manifest with no signature and every catalog list whose signature does not verify,
# and commits the signatures with the built-in token, whose commits start no further workflow.
# The machine that publishes opens the pull request from a fork, then pulls and verifies the
# signatures (briardhq/briard, scripts/publish-release.sh `stage` and `sign`; the catalog's publish
# likewise): it holds the publish credential and not the key, and this job holds the key and not
# the credential.
#
# Nothing runs on a pull request. A workflow a pull request adds or changes runs, if at all, without
# secrets and outside the environment, whose branch rule admits main alone.
#
# No third-party action and no checkout action: the key is exposed to the runner and to the lines
# below, nothing else. A release manifest is signed once. Its id never names other bytes, so one
# that has a signature has its signature, and a rotated key does not re-sign the history.
#
# A CATALOG LIST IS CURRENT STATE, so it is signed again whenever its signature does not verify:
# after a pull request changed it, and after a key rotation. Before signing, the job refuses unless
# every line's version file is here with the sha256 the line names and, for every line that is new
# since the list was last signed, the version is not lower than the one before it, the version
# file's images come from the image repositories the app's previous version used, and each is what
# an upstream tag of that version resolves to NOW. Those are read from this repository, which the
# publishing machine cannot write, and from the registries; the pull request's description is not
# consulted. A new app's repository is checked by eye at its first merge (README).
name: sign

on:
  push:
    branches: [main]
    paths: ['releases/**', 'catalog/**']

concurrency:
  group: sign
  cancel-in-progress: false

permissions: {}

jobs:
  sign:
    if: github.repository == 'briardhq/signing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Sign the manifests that have no signature, and the catalog lists that need one
        shell: bash
        env:
          RELEASE_SIGN_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key=$RUNNER_TEMP/release.pem
          pub=$RUNNER_TEMP/release.pub
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGN_KEY" > "$key"
          unset RELEASE_SIGN_KEY
          openssl pkey -in "$key" -pubout -out "$pub"
          # The whole history: what a list was when it was last signed is read from it.
          git clone --quiet --branch main "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          signed=0
          sign() {
            # -rawin is PureEdDSA over the whole file, which is what a node verifies.
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$1" -out "$1.sig"
            [ "$(stat -c%s "$1.sig")" = 64 ]
            openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "$1" -sigfile "$1.sig" >/dev/null
            git add "$1.sig"
            echo "signed $1"
            signed=$((signed + 1))
          }
          refuse() { echo "REFUSED: $*" >&2; exit 1; }

          while IFS= read -r m; do
            [ ! -e "$m.sig" ] || continue
            sign "$m"
          done < <(find releases -name manifest.json | sort)

          # --- The catalog's lists: catalog/<list>.json, beside catalog/<app>/<version>.json. ---
          # The key that signed the published catalog before this job did (public).
          prior=$RUNNER_TEMP/prior.pub
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' 'MCowBQYDK2VwAyEAsSq+bTDotJ11lijo61ODb2NM5/oQJD9ZoRbq8Q9JnBs=' '-----END PUBLIC KEY-----' > "$prior"
          sha() { printf 'sha256:%s' "$(sha256sum < "$1" | cut -d' ' -f1)"; }
          repos() { jq -r '.containers[].image | sub("@.*"; "")' "$1"; }
          # upstream <repo> <digest> <version>: the digest is what a tag of THIS version (the
          # version or a leading v, either with a -variant) resolves to now. Any other release's
          # tag would let an old image pass as the new version.
          upstream() {
            local t
            for t in $(skopeo list-tags "docker://$1" | jq -r --arg v "$3" \
              '.Tags[] | select(. == $v or . == "v" + $v or startswith($v + "-") or startswith("v" + $v + "-"))'); do
              if [ "sha256:$(skopeo inspect --raw "docker://$1:$t" | sha256sum | cut -d' ' -f1)" = "$2" ]; then
                echo "  $1:$t is $2"
                return 0
              fi
            done
            return 1
          }
          for list in catalog/*.json; do
            [ -e "$list" ] || continue
            if [ -e "$list.sig" ] && openssl pkeyutl -verify -pubin -inkey "$pub" -rawin -in "$list" -sigfile "$list.sig" >/dev/null 2>&1; then
              continue
            fi
            command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo >/dev/null; }
            # The list as it was last signed: the newest commit whose signature of it verifies
            # under this job's key -- never merely the last one to touch the .sig, which a pull
            # request could carry. Failing that, under the key that signed the catalog before
            # this job did, which is the seed's alone: once the job has signed the list, its own
            # signature is always found first.
            before=$RUNNER_TEMP/before.json
            echo '{"apps":[]}' > "$before"
            for k in "$pub" "$prior"; do
              for c in $(git log --format=%H -- "$list.sig"); do
                git show "$c:$list" > "$RUNNER_TEMP/l" 2>/dev/null && git show "$c:$list.sig" > "$RUNNER_TEMP/s" 2>/dev/null || continue
                if openssl pkeyutl -verify -pubin -inkey "$k" -rawin -in "$RUNNER_TEMP/l" -sigfile "$RUNNER_TEMP/s" >/dev/null 2>&1; then
                  cp "$RUNNER_TEMP/l" "$before"
                  echo "$list was last signed at $c"
                  break 2
                fi
              done
            done
            while IFS=$'\t' read -r app ver id; do
              f=catalog/$app/$ver.json
              [ -f "$f" ] || refuse "$list names $app $ver, and $f is not here"
              [ "$(sha "$f")" = "$id" ] || refuse "$f is $(sha "$f"); $list names $id"
              old=$(jq -r --arg a "$app" '.apps[] | select(.name == $a and .available) | "\(.version)\t\(.identity)"' "$before")
              [ "$old" != "$ver"$'\t'"$id" ] || continue # signed before, as it is
              echo "$list: $app $ver is new"
              if [ -n "$old" ]; then
                was=${old%%$'\t'*}
                [ "$(printf '%s\n%s\n' "$was" "$ver" | sort -V | tail -1)" = "$ver" ] || refuse "$app goes down, $was -> $ver"
                [ "$(repos "catalog/$app/$was.json")" = "$(repos "$f")" ] ||
                  refuse "$app $ver pulls from $(repos "$f" | tr '\n' ' ')where $was pulled from $(repos "catalog/$app/$was.json" | tr '\n' ' ')"
              fi
              while IFS= read -r img; do
                upstream "${img%@*}" "${img#*@}" "$ver" || refuse "$app $ver: ${img#*@} is no upstream $ver tag's in ${img%@*}"
              done < <(jq -r '.containers[].image' "$f")
            done < <(jq -r '.apps[] | select(.available) | [.name, .version, .identity] | @tsv' "$list")
            sign "$list"
          done

          if [ "$signed" = 0 ]; then
            echo "nothing to sign"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "sign $signed files"
          for _ in 1 2 3; do
            git push --quiet origin HEAD:main && exit 0
            git pull --quiet --rebase origin main
          done
          echo "cannot push the signatures to main" >&2
          exit 1
